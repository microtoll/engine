# microtoll.dev (DECISIONS.md D-38; launch item 9): the static site built by
# docs/build.mjs into docs/site, published with GitHub Pages on every push
# to main. The build is run here, not committed, so the site always matches
# the tree. The CNAME file tells Pages the custom domain; the DNS for it is
# set at the registrar (a CNAME record microtoll.dev -> microtoll.github.io,
# or the four A records GitHub documents).
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run docs
      - run: echo microtoll.dev > docs/site/CNAME
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: docs/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
