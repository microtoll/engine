# A sample reverse proxy for blind-store (DESIGN.md §5.3): TLS 1.2/1.3 with
# the post-quantum hybrid group first, no server tokens, NO access log, the
# security headers on every location (add_header at a location level cancels
# inheritance, so each location re-adds them all), the WebSocket upgrade block with per-address
# limits, the client's address and any geo headers blanked before they reach
# the server, and /healthz ungated with no-store.
#
# Replace app.example, the certificate paths and the upstream address. The
# static app (the pages and the vendored packages) is served from `root`.

worker_processes auto;
events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    server_tokens off;
    access_log    off;                 # no request log: an address beside a path is a record nobody needs
    error_log     /dev/stderr warn;
    client_max_body_size 1m;
    sendfile on;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Per visitor address: sockets open at once, and new ones a minute. Mobile
    # networks put many people behind one address, which is why the numbers
    # are not smaller; revisit with real traffic.
    limit_conn_zone $binary_remote_addr zone=wsconn:2m;
    limit_req_zone  $binary_remote_addr zone=wsnew:2m rate=60r/m;

    # The page holds the account root key in memory, so an injected script is
    # not a defacement: it is the compromise of everything that key protects.
    # No inline script, no third-party origin; connect-src names the socket.
    map $host $csp_app {
        default "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' wss://app.example; worker-src 'self' blob:; manifest-src 'self'";
    }

    server {
        listen 80;
        server_name app.example;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name app.example;
        ssl_certificate     /etc/nginx/cert/app.example.pem;
        ssl_certificate_key /etc/nginx/cert/app.example.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        # The hybrid post-quantum group first (TLS 1.3 only can negotiate it).
        ssl_ecdh_curve X25519MLKEM768:X25519:prime256v1;
        ssl_session_cache shared:SSL:2m;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy $csp_app always;

        root /usr/share/nginx/html;

        # The WebSocket.
        location /ws {
            proxy_pass http://127.0.0.1:8020;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            # The server sees routing keys; it must never also see an address
            # or a location. Empty values are not passed upstream at all.
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Real-IP "";
            proxy_set_header Forwarded "";
            proxy_set_header CF-Connecting-IP "";
            proxy_set_header True-Client-IP "";
            proxy_set_header CF-IPCountry "";
            proxy_set_header CF-IPCity "";
            proxy_set_header CF-IPLatitude "";
            proxy_set_header CF-IPLongitude "";
            proxy_set_header CF-Region "";
            proxy_set_header CF-Region-Code "";
            proxy_set_header CF-Postal-Code "";
            proxy_set_header CF-Metro-Code "";
            proxy_set_header CF-Timezone "";
            proxy_set_header CF-IPContinent "";
            limit_conn wsconn 60;
            limit_conn_status 429;
            limit_req zone=wsnew burst=60 nodelay;
            limit_req_status 429;
            proxy_read_timeout 300s;
            proxy_buffers 8 32k;
            proxy_buffer_size 64k;
            reset_timedout_connection on;
        }

        # The load balancer's probe: ungated, never cached, and it says
        # nothing but ok or unhealthy.
        location = /healthz {
            proxy_pass http://127.0.0.1:8020/healthz;
            proxy_http_version 1.1;
            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
        }

        # The app: no caching of the pages that hold keys.
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-store" always;
            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Content-Security-Policy $csp_app always;
        }
    }
}
