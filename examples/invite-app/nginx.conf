# nginx for the invite example: the page and the packages as static files,
# /ws forwarded to blind-store, the same headers and blanking as the
# deployment sample (../../deploy/nginx.sample.conf), plain HTTP because it
# is localhost -- which is a secure context, so Web Crypto and passkeys work.
worker_processes 1;
events { worker_connections 256; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    types { text/javascript js mjs; }
    server_tokens off;
    access_log    off;
    error_log     /dev/stderr warn;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        root /usr/share/nginx/html;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' ws://localhost:8089 ws://127.0.0.1:8089; img-src 'self' data:" always;

        location = / {
            return 302 /examples/invite-app/;
        }

        location /ws {
            proxy_pass http://blind-store:8020;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Real-IP "";
            proxy_set_header Forwarded "";
            proxy_read_timeout 300s;
        }

        location = /healthz {
            proxy_pass http://blind-store:8020/healthz;
            proxy_http_version 1.1;
        }

        location / {
            try_files $uri $uri/ =404;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Cache-Control "no-store" always;
            add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' ws://localhost:8089 ws://127.0.0.1:8089; img-src 'self' data:" always;
        }
    }
}
