name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # The database-backed suites (blind-store, the notes example) run against
    # this Postgres; with CI set, a missing database is a failure, never a
    # silently green run.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 15433:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CI: 'true'
      BLIND_STORE_TEST_DB: postgres://test:test@127.0.0.1:15433/test
    steps:
      # Actions are pinned to a full commit SHA, never a moving tag.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # The engine schema, as the container's init directory would apply it,
      # and the service role's login, as packages/blind-store/schema/900_app_login.sh gives it.
      - run: psql "$BLIND_STORE_TEST_DB" -v ON_ERROR_STOP=1 -f packages/blind-store/schema/000_blind_store.sql
      - run: psql "$BLIND_STORE_TEST_DB" -v ON_ERROR_STOP=1 -c "ALTER ROLE blind_store_app LOGIN PASSWORD 'apptest'"
      - run: npm run check
      # The snapshot @microtoll/mcp ships is regenerated by the check; a
      # commit that left it stale shows up here.
      - run: git diff --exit-code -- packages/mcp/generated
