# Scaffolded by @microtoll/mcp: the page and the packages (from
# node_modules) as static files, /ws forwarded to blind-store, the client's
# address blanked, no access log. Plain HTTP for localhost; a deployment
# terminates TLS in front (see the engine's deploy/nginx.sample.conf).
worker_processes 1;
events { worker_connections 256; }

http {
    include       mime.types;
    default_type  application/octet-stream;
    types { text/javascript js mjs; }
    server_tokens off;
    access_log    off;
    error_log     /dev/stderr warn;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        root /usr/share/nginx/html;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' __WS_ORIGIN__; img-src 'self' data:" always;

        location /ws {
            proxy_pass http://blind-store:8020;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Real-IP "";
            proxy_set_header Forwarded "";
            proxy_read_timeout 300s;
        }

        location = /healthz {
            proxy_pass http://blind-store:8020/healthz;
            proxy_http_version 1.1;
        }

        # Only the app's files and the packages' sources are served; nothing else in node_modules.
        location ~ ^/node_modules/@microtoll/[a-z-]+/src/ { try_files $uri =404; }
        location /node_modules/ { return 404; }

        location / {
            try_files $uri $uri/ =404;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header Cache-Control "no-store" always;
            add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self' __WS_ORIGIN__; img-src 'self' data:" always;
        }
    }
}
